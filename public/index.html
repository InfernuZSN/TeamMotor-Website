<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — TeamMotor</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-12">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title">
          <h1>Dashboard</h1>
          <p>Here's how the shop is doing today</p>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="page page-dashboard">
      <div class="dash-toolbar">
        <div class="dash-live" id="dashLive" title="The numbers refresh by themselves"><span class="dash-live-dot"></span><span id="dashUpdated">Live</span></div>
        <div class="dash-period" role="group" aria-label="Period for Products Sold and Top / Slow Sellers">
          <span>Products sold:</span>
          <div class="chip-row" id="periodChips">
            <button type="button" class="chip active" data-period="today">Today</button>
            <button type="button" class="chip" data-period="week">7 days</button>
            <button type="button" class="chip" data-period="month">30 days</button>
          </div>
        </div>
      </div>

      <div class="stat-grid dash-cards" id="statGrid"></div>

      <section class="card dash-panel" aria-label="Details">
        <div class="dash-views chip-row" id="dashViews" role="tablist"></div>
        <div class="dash-body" id="dashBody"></div>
      </section>
    </main>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
