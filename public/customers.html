<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Customers — TeamMotor</title>
<link rel="icon" type="image/png" sizes="128x128" href="img/favicon.png?v=4">
<link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-12">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title">
          <h1>Customers</h1>
          <p>Buyers, purchase history and warranties</p>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div class="flex gap-8" style="flex-wrap:wrap;align-items:center;">
          <div class="search-input" style="max-width:20rem;"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.3" y1="15.3" x2="21" y2="21"/></svg><input type="text" id="custSearch" placeholder="Search name, phone, email or ID..." aria-label="Search customers"></div>
          <select class="select-filter" id="custStatus" aria-label="Filter by status"><option value="Active">Active</option><option value="Inactive">Inactive</option><option value="">All</option></select>
        </div>
        <div class="actions"><button class="btn btn-primary" id="addCustomerBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Customer</button></div>
      </div>
      <div class="table-card"><div class="table-wrap"><table>
        <thead><tr><th>Customer ID</th><th>Name</th><th>Phone</th><th>Email</th><th class="text-right">Total Purchases</th><th class="text-right">Total Spent</th><th>Last Purchase</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="custTbody"></tbody>
      </table></div>
        <div id="custPager"></div></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="custModalOverlay"><div class="modal">
  <div class="modal-header"><h2 id="custModalTitle">Add Customer</h2><button class="modal-close" data-close="custModalOverlay" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button></div>
  <div class="modal-body"><form id="custForm" onsubmit="return false;" novalidate>
    <div class="field"><label for="cName">Full name *</label><input type="text" id="cName" required maxlength="80"></div>
    <div class="field"><label for="cPhone">Phone *</label><input type="text" id="cPhone" required maxlength="20" pattern="[0-9+()\-\s]{7,20}" data-error-msg="Enter a valid phone number."></div>
    <div class="field"><label for="cEmail">Email</label><input type="email" id="cEmail" maxlength="80"></div>
    <div class="field"><label for="cAddress">Address</label><input type="text" id="cAddress" maxlength="160"></div>
    <div class="field"><label for="cNotes">Notes</label><textarea id="cNotes" rows="2" maxlength="500"></textarea></div>
  </form></div>
  <div class="modal-footer"><button class="btn btn-secondary" data-close="custModalOverlay" type="button">Cancel</button><button class="btn btn-primary" id="custSaveBtn" type="button">Save Customer</button></div>
</div></div>

<div class="modal-overlay" id="custViewOverlay"><div class="modal modal-lg" style="max-width:52rem;">
  <div class="modal-header"><h2 id="custViewTitle">Customer</h2><button class="modal-close" data-close="custViewOverlay" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button></div>
  <div class="modal-body" id="custViewBody"></div>
  <div class="modal-footer"><button class="btn btn-secondary" data-close="custViewOverlay" type="button">Close</button><button class="btn btn-primary" id="custViewEditBtn" type="button">Edit</button></div>
</div></div>

<script src="js/store.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/customers.js"></script>

</body>
</html>
