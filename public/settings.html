<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — TeamMotor</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-12">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title">
          <h1>Settings</h1>
          <p>Shop details, VAT and alerts (Admin only)</p>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="page">
      <div class="grid-2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.25rem;align-items:start;">
        <form class="card" id="settingsForm" onsubmit="return false;" novalidate style="padding:1.25rem;">
          <h3 style="margin-top:0;">Shop details (printed on receipts)</h3>
          <div class="field"><label for="sShopName">Shop name *</label><input type="text" id="sShopName" required maxlength="80"></div>
          <div class="field"><label for="sTagline">Tagline</label><input type="text" id="sTagline" maxlength="80"></div>
          <div class="field"><label for="sAddress">Address (one line per row)</label><textarea id="sAddress" rows="3" maxlength="300"></textarea></div>
          <div class="field"><label for="sPhone">Phone</label><input type="text" id="sPhone" maxlength="40"></div>
          <div class="field"><label for="sTin">TIN / VAT registration line</label><input type="text" id="sTin" maxlength="80" placeholder="VAT REG. TIN: 000-000-000-00000"></div>
          <div class="field"><label for="sFooter">Receipt footer (one line per row)</label><textarea id="sFooter" rows="2" maxlength="200"></textarea></div>
          <h3>VAT</h3>
          <div class="field"><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="sVatEnabled"> Charge / show VAT on sales</label></div>
          <div class="field"><label for="sVatRate">VAT rate (%)</label><input type="number" id="sVatRate" min="0" max="100" step="0.01"></div>
          <div class="field"><label for="sVatMode">Prices are</label><select id="sVatMode"><option value="inclusive">VAT-inclusive (shelf price already has VAT)</option><option value="exclusive">VAT-exclusive (VAT added at checkout)</option></select></div>
          <h3>Expiration monitoring</h3>
          <div class="field"><label for="sExpiry">Warn this many months before expiry</label><input type="number" id="sExpiry" min="1" max="24" step="1"></div>
          <div class="form-error" id="setError" role="alert"></div>
          <button class="btn btn-primary" id="setSaveBtn" type="button">Save Settings</button>
          <div class="hint" style="margin-top:8px;">New settings apply to future sales. Past receipts keep the shop details and VAT they were issued with.</div>
        </form>
        <div class="card" style="padding:1.25rem;"><h3 style="margin-top:0;">Receipt preview (58 mm)</h3><div id="settingsPreview" style="max-width:300px;margin:0 auto;"></div></div>
      </div>
    </main>
  </div>
</div>


<script src="js/mock-data.js"></script>
<script src="js/local-api.js"></script>
<script src="js/store.js"></script>
<script src="js/analytics.js"></script>
<script src="js/receipt.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/settings.js"></script>

</body>
</html>
